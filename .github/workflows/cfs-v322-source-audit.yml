name: CFS v3.22 source and RFID audit (offline)

on:
  pull_request:
    paths:
      - "firmware/v3.12-remaining/**"
      - "firmware/v3.19-volatile-ram/**"
      - "firmware/v3.22-readonly-state-probes/**"
      - ".github/workflows/cfs-v322-source-audit.yml"
  workflow_dispatch:

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM Thumb toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi binutils-arm-none-eabi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated emulator
        run: python -m pip install "unicorn>=2.0,<3.0" "capstone>=5,<6"
      - name: Verify 28 RFID/remaining ARM routine bodies
        run: python firmware/v3.22-readonly-state-probes/verify_rfid_regression.py
      - name: Static builder preflight + SHA-pinned offline build
        working-directory: firmware/v3.22-readonly-state-probes
        run: |
          set -eu
          python bench_preflight_v3_22.py >/tmp/cfs-v322-preflight.json
          python build-v3_22.py \
            --base ../v3.19-volatile-ram/cfs0_050_G32-cfs0_000_153-runtime-config-v3_13.bin \
            --out CFS-v3_22-PROBE-EXPERIMENTAL-UNFLASHED.bin >/tmp/cfs-v322-build.json
          python - <<'PY'
          import hashlib
          from pathlib import Path
          image=Path("CFS-v3_22-PROBE-EXPERIMENTAL-UNFLASHED.bin").read_bytes()
          assert len(image) == 178140
          assert hashlib.sha256(image).hexdigest() == (
              "40dbaad88de7b6f9435592fa03b081e9b96663a9e84896b1ad8021a8f13cf8c7")
          print("PASS: exact original unmodified v3.22 image")
          PY
      - name: Verify Cortex-M3 callsite and host protocol emulation
        working-directory: firmware/v3.22-readonly-state-probes
        run: python emulate_v3_22.py
      - name: Validate opt-in original-to-v3.22 auditor syntax
        run: python -m py_compile firmware/v3.22-readonly-state-probes/audit_stock_vs_v322.py
      - name: Verify MCU phase-2 memory bounds against SHA-pinned offline build
        working-directory: firmware/v3.22-readonly-state-probes
        run: |
          python - <<'PY'
          import importlib.util
          import hashlib
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("cfs_memory", "flash_ram_phase2_audit.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          base = Path("../v3.19-volatile-ram/cfs0_050_G32-cfs0_000_153-runtime-config-v3_13.bin").read_bytes()
          curr = Path("CFS-v3_22-PROBE-EXPERIMENTAL-UNFLASHED.bin").read_bytes()
          assert hashlib.sha256(curr).hexdigest() == module.PINS["running_v322"][1]
          assert hashlib.sha256(base).hexdigest() == module.PINS["intermediate_v313"][1]
          b = module.report_image(base, "intermediate_v313")
          c = module.report_image(curr, "running_v322")
          assert b["header_crc_valid"] and c["header_crc_valid"]
          assert c["nominal_heap_window_bytes"] == 37080
          assert c["bytes_to_unverified_0x0803b800"] == 36
          assert c["bytes_to_fast_fetch_end_NOT_AUTHORISED"] == 18468
          assert c["bytes_to_total_flash_end_NOT_AUTHORISED"] == 280612
          assert module.literal_observations(curr)[
              "pre_256k_end_0x0803b800_to_0x0803ffff"]["count"] == 0
          print("PASS: v3.13/v3.22 offline CPU vectors + CRC + memory map")
          PY
      - name: Verify loader-page map from original-layout constants (NO MCU IO)
        working-directory: firmware/v3.22-readonly-state-probes
        run: |
          python bootloader_static_audit.py \
            --v322 CFS-v3_22-PROBE-EXPERIMENTAL-UNFLASHED.bin \
            --self-test >/tmp/cfs-bootloader-static.json
          python - <<'PY'
          import json
          with open("/tmp/cfs-bootloader-static.json") as f:
              result = json.load(f)
          assert result["four_mutations_rejected"] == 4
          assert result["physical_flash"]["app_last_image_page"] == 118
          assert result["physical_flash"]["historical_build_boundary_first_excluded_page"] == 119
          assert result["physical_flash"]["undocumented_2k_pages_between_policy_and_fast_fetch_end"] == 9
          assert result["physical_flash"]["stock_application_last_flash_page_pointer"] == "0x807f800"
          assert result["loader"]["bootloader_raw_dump_available"] is False
          assert result["conclusions"]["authorises_flash"] is False
          assert result["conclusions"]["safe_to_expand_CFS_binary"] is False
          print("PASS: offline bootloader evidence, no update-authorisation")
          PY
      - name: Verify stock CFS FMC driver and page-erase/program callers (OFFLINE)
        working-directory: firmware/v3.22-readonly-state-probes
        run: |
          python stock_fmc_driver_audit.py \
            --v322 CFS-v3_22-PROBE-EXPERIMENTAL-UNFLASHED.bin \
            --self-test >/tmp/cfs-v322-fmc-audit.json
          python - <<'PY'
          import json
          with open("/tmp/cfs-v322-fmc-audit.json") as f:
              result = json.load(f)
          assert result["v322"]["flash_driver"]["critical_instruction_count"] == 23
          assert result["fail_closed_mutation_tests"]["total"] == 5
          assert result["v322"]["flash_driver"]["page_erase_target"] == "0x803175a"
          assert result["v322"]["flash_driver"]["word_program_target"] == "0x80318be"
          assert result["flash_access_findings"]["last_page_address_explicit_in_stock_ROM"]
          assert not result["flash_access_findings"]["safe_to_flash_a_larger_app"]
          assert result["no_device_open_or_serial_commands"]
          print("PASS: exact original FMC erase/program paths, no new Flash release")
          PY
      - name: Verify original database callgraph and safe handler alias size audit
        working-directory: firmware/v3.22-readonly-state-probes
        run: |
          python database_path_and_sizeopt_audit.py \
            --v322 CFS-v3_22-PROBE-EXPERIMENTAL-UNFLASHED.bin \
            --asm handler-v3_22.S --linker link.ld \
            --self-test >/tmp/cfs-database-sizeopt-audit.json
          python - <<'PY'
          import json
          with open("/tmp/cfs-database-sizeopt-audit.json") as f:
              d = json.load(f)
          assert len(d["current"]["matched_direct_calls"]) == 11
          assert len(d["current"]["matched_database_and_RFID_strings"]) == 4
          assert d["sizeopt_alias_and_table"]["source_alias_config_ptr"] == "0x803af72"
          assert d["sizeopt_alias_and_table"]["alias_referenced_by_BL_config_ptr"]
          assert not d["sizeopt_alias_and_table"]["config_v2_ensure_can_be_deleted_safely"]
          assert d["sizeopt_alias_and_table"]["saved_handler_bytes_IN_OFFLINE_EXPERIMENT"] == 4
          assert d["fail_closed_tests"]["count"] == 5
          assert not d["safe_to_flash_larger_app"]
          assert not d["runtime_use_of_last_flash_page_proven"]
          print("PASS: 11 Creality database/FMC callsites, alias safety, 4B offline estimate")
          PY
      - name: Validate original Creality CFS motor command routes (offline)
        working-directory: firmware/v3.22-readonly-state-probes
        run: |
          python motor_command_callgraph_audit.py \
            --v322 CFS-v3_22-PROBE-EXPERIMENTAL-UNFLASHED.bin \
            --scan-all --self-test >/tmp/cfs-motor-command-callgraph.json
          python - <<'PY'
          import json
          with open("/tmp/cfs-motor-command-callgraph.json") as f:
              d = json.load(f)
          v = d["v322"]
          assert v["callsite_total"] == 102
          assert v["forward_wrapper_static_BL"] == 33
          assert v["reverse_wrapper_static_BL"] == 17
          assert v["zero_command_wrapper_static_BL"] == 50
          assert v["direct_duty_setter_static_BL"] == 2
          assert v["full_scan_completed"]
          assert len(v["wrapper_tails"]) == 3
          assert d["fail_closed"]["count"] == 9
          assert v["callsite_inventory_sha256"] == "d66b17e67f80af1a8e9eb89ac435fadb4250a8c5c441a5580468e94b45617081"
          assert not v["zero_duty_command_proves_motor_idle"]
          assert not v["all_physical_motor_start_stop_events_proven"]
          assert not v["safe_to_install_trace_hook"]
          assert not v["safe_to_flash_expanded_app"]
          print("PASS: 102 original ROM command calls, 50 zero-duty sites, 9 CRC-valid rejects")
          PY
      - name: Emulate original shared motor duty zero/nonzero branches (OFFLINE)
        working-directory: firmware/v3.22-readonly-state-probes
        run: |
          python motor_duty_zero_branch_emulate.py \
            --v322 CFS-v3_22-PROBE-EXPERIMENTAL-UNFLASHED.bin \
            --self-test >/tmp/cfs-duty-zero-branch.json
          python - <<'PY'
          import json
          with open("/tmp/cfs-duty-zero-branch.json") as f:
              result = json.load(f)
          p = result["v322"]
          assert len(p["pinned_thumb_instructions"]) == 31
          c = p["simulation_cases"]
          assert [x["duty_requested"] for x in c] == [0, 1, 127, 255, 300]
          assert c[0]["control_branch"] == "zero"
          assert c[0]["simulator_paused_at"] == "0x801e14a"
          assert c[0]["low_level_hardware_calls_replaced_by_mocks"] == 4
          assert all(x["control_branch"] == "nonzero" for x in c[1:])
          assert all(x["simulator_paused_at"] == "0x802f190" for x in c[1:])
          assert all(x["low_level_hardware_calls_replaced_by_mocks"] == 2 for x in c[1:])
          assert c[-1]["RAM_snapshot_before_external_state_update"]["current_requested_duty"] == 255
          assert c[0]["RAM_snapshot_before_external_state_update"]["current_requested_duty"] == 0
          assert result["fail_closed_mutations"]["count"] == 9
          helper = p["software_RAM_status_helper"]
          assert helper["helper_entry"] == "0x801e1aa"
          assert len(helper["direct_callers"]) == 3
          assert [x["software_status_byte"] for x in helper["inverted_RAM_byte_emulations"]] == [0, 1, 20, 255]
          assert [x["helper_result"] for x in helper["inverted_RAM_byte_emulations"]] == [1, 0, 0, 0]
          assert helper["no_independent_motor_sensor"]
          assert helper["not_suitable_as_standalone_motor_active_guard"]
          assert all(x["only_data_reads"] == [
              {"address": "0x801e244", "size": 4},
              {"address": "0x2000499c", "size": 1},
          ] for x in helper["inverted_RAM_byte_emulations"])
          assert not result["motor_idle_proven"]
          assert not result["flash_release_authorized"]
          print("PASS: 5 original Thumb duty-path cases, no real motor or serial effects")
          PY
      - name: Verify original CFS motor driver callback interfaces (NO DEVICE IO)
        working-directory: firmware/v3.22-readonly-state-probes
        run: |
          python motor_driver_callback_chain_audit.py \
            --v322 CFS-v3_22-PROBE-EXPERIMENTAL-UNFLASHED.bin \
            --self-test >/tmp/cfs-driver-callbacks.json
          python - <<'PY'
          import json
          with open("/tmp/cfs-driver-callbacks.json") as f:
              d = json.load(f)
          v = d["v322"]
          assert len(v["static"]["verified_Thumb_instructions"]) == 27
          assert v["static"]["device_dispatch_is_indirect"]
          assert v["static"]["gpio_dispatch_is_indirect"]
          c = v["mock_callback_trials"]
          assert len(c) == 5
          assert [(x["interface"], x["synthetic_callback_enabled"])
                  for x in c] == [
                      ("device", True), ("device", True),
                      ("device", False), ("gpio", True), ("gpio", True)
                  ]
          assert [x["dispatcher_returned"] for x in c] == [
              "0x0", "0x5a", "0xffffffd3", "0x0", "0x5a"
          ]
          assert [x["actual_mock_callback_invocations"] for x in c] == [
              1, 1, 0, 1, 1
          ]
          assert d["fail_closed_tests"]["count"] == 9
          assert not d["MCU_motor_idle_confirmed"]
          assert not d["release_approved"]
          assert not v["validated_hardware_callback_implementation"]
          assert not d["hardware_or_serial_interface_opened"]
          print("PASS: 2 indirect callchains, arbitrary callback return, 9 CRC-valid mutations")
          PY
      - name: Verify five original CFS callback device objects in isolated ROM emulator
        working-directory: firmware/v3.22-readonly-state-probes
        run: |
          python motor_driver_registration_audit.py \
            --v322 CFS-v3_22-PROBE-EXPERIMENTAL-UNFLASHED.bin \
            --self-test >/tmp/cfs-driver-register.json
          python - <<'PY'
          import json
          with open("/tmp/cfs-driver-register.json") as f:
              d = json.load(f)
          v = d["v322"]
          assert len(v["static"]["matched_Thumb_instructions"]) == 28
          assert v["static"]["object_count_static"] == 5
          assert v["static"]["object_stride_bytes"] == 96
          assert d["mutations"]["total"] == 8
          objects = v["objects"]
          assert [x["object_address"] for x in objects] == [
              "0x2000075c", "0x200007bc", "0x2000081c",
              "0x2000087c", "0x200008dc"
          ]
          for x in objects:
              ptr = x["pointer_fields"]
              assert ptr["0x30"] == "0x80193c5"
              assert ptr["0x34"] == "0x8019401"
              assert ptr["0x38"] == "0x801939d"
              assert x["field_0x14"] == "0x1d"
              assert x["object_registered_with_mock_OS"]
              assert not x["native_callback_bodies_executed"]
              assert not x["real_motor_hardware_owner_proven"]
          assert not d["real_CFS_motor_instance_identity_proven"]
          assert not d["firmware_release_allowed"]
          print("PASS: 5 original object constructors, 3 callback pointers each, 8 CRC-valid corruptions")
          PY
      - name: Verify original CFS pwm1 named device pointer lookup (offline)
        working-directory: firmware/v3.22-readonly-state-probes
        run: |
          python motor_pwm1_named_lookup_audit.py \
            --v322 CFS-v3_22-PROBE-EXPERIMENTAL-UNFLASHED.bin \
            --self-test >/tmp/cfs-pwm1-device-lookup.json
          python - <<'PY'
          import json
          with open("/tmp/cfs-pwm1-device-lookup.json") as f:
              d = json.load(f)
          v = d["v322"]
          assert len(v["static"]["instructions"]) == 10
          assert v["static"]["name_literal"] == {
              "at": "0x801e28c", "value": "pwm1"
          }
          assert v["static"]["lookup_device_type"] == 9
          assert v["clearing"]["cleared_RAM_field"] == "0x20004a14"
          assert v["clearing"]["original_store_observed"]
          cases = v["named_lookup_cases"]
          assert [x["synthetic_registry_result"] for x in cases] == [
              "0x2000075c", "0x20003000", "0x0"
          ]
          assert all(x["lookup"] == {
              "original_ROM_name_pointer": "0x801e28c",
              "literal": "pwm1", "lookup_type": 9
          } for x in cases)
          assert all(x["stored_at"] == "0x20004a14" for x in cases)
          assert all(x["synthetic_registry_result"] == x["stored_value"]
                     for x in cases)
          assert d["mutations"]["count"] == 8
          assert not d["real_CFS_motor_instance_identity_proven"]
          assert not d["all_CFS_motors_idle_proven"]
          assert not d["firmware_release_authorized"]
          print("PASS: pwm1 type9 lookup, original ptr store, 3 mock cases, 8 CRC-valid rejects")
          PY
      - name: Audit stock PWM decoder and GD32 timer bases (offline only)
        working-directory: firmware/v3.22-readonly-state-probes
        run: |
          python pwm_hal_dispatch_readonly_audit.py \
            --v322 CFS-v3_22-PROBE-EXPERIMENTAL-UNFLASHED.bin \
            --self-test >/tmp/cfs-pwm-hal.json
          python - <<'PY'
          import json
          with open("/tmp/cfs-pwm-hal.json") as f:
              d = json.load(f)
          v = d["v322"]
          assert len(v["static"]["pinned_Thumb_instructions"]) == 31
          assert len(v["timer_base_selector_cases"]) == 14
          assert v["timer_base_selector_cases"][0]["timer_register_base"] == "0x40012c00"
          assert v["timer_base_selector_cases"][-1]["timer_register_base"] == "0x40002000"
          c = v["generic_pwm_dispatch_cases"]
          assert [x["request_code"] for x in c] == [
              "0x1e00", "0x1e01", "0x1e02",
              "0x1e03", "0x1e04", "0x1e05"
          ]
          assert [x["target"] for x in c] == [
              "0x802820c", "0x802820c", "0x802828e",
              "0x80285e0", "unsupported-return", "unsupported-return"
          ]
          assert all(x["result"] == 5 for x in c[-2:])
          assert c[0]["enable_or_disable_value"] == 1
          assert c[1]["enable_or_disable_value"] == 0
          assert d["mutations"]["count"] == 10
          assert not v["actual_pwm1_registry_driver_identity_proven"]
          assert not v["PWM_output_zero_proves_motor_stopped"]
          assert not d["physical_CFS_access"]
          assert not d["firmware_release_approved"]
          print("PASS: PWM 4 handled/2 rejected requests, 14 timer bases, 10 CRC-valid mutants")
          PY
      - name: Validate extended CFS PWM 0x1E04/0x1E05 shim (offline)
        working-directory: firmware/v3.22-readonly-state-probes
        run: |
          python extended_pwm_1e04_1e05_audit.py \
            --v322 CFS-v3_22-PROBE-EXPERIMENTAL-UNFLASHED.bin \
            --self-test >/tmp/cfs-extended-pwm.json
          python - <<'PY'
          import json
          with open("/tmp/cfs-extended-pwm.json") as f:
              d = json.load(f)
          v = d["v322"]
          assert len(v["static"]["exact_Thumb_pins"]) == 23
          c = v["cases"]
          assert len(c) == 9
          assert [x["request"] for x in c[:4]] == [
              "0x1e04", "0x1e04", "0x1e05", "0x1e05"
          ]
          assert [x["status_word_after"] for x in c[:4]] == [
              "0x1", "0x1", "0x0", "0x0"
          ]
          assert [x["backend_callback_invocations"] for x in c] == [
              0, 0, 0, 0, 0, 1, 1, 1, 1
          ]
          assert [x["returned"] for x in c] == [
              "0x0", "0x0", "0x0", "0x0", "0x0",
              "0x5a", "0x5a", "0x0", "0x5a"
          ]
          refs = v["static_reference_inventory"]
          assert not refs["direct_Thumb_BL_sites_in_saved_APP"]
          assert all(not x for x in refs["raw_address_word_sites_in_saved_APP"].values())
          assert not refs["function_runtime_unreachable_proven"]
          assert not refs["actual_pwm1_device_callback_binding_proven"]
          assert d["fail_closed"]["count"] == 11
          assert not d["runtime_pwm1_callback_identity_proven"]
          assert not d["motor_idle_proven"]
          assert not d["firmware_release_authorized"]
          print("PASS: 9 mock cases, 23 original instructions, 11 CRC-valid rejects; runtime pwm1 link NOT proven")
          PY
      - name: Trace original RT-Thread PWM1 typed registry linked-list lookup (OFFLINE)
        working-directory: firmware/v3.22-readonly-state-probes
        run: |
          python pwm1_rt_registry_walk_audit.py \
            --v322 CFS-v3_22-PROBE-EXPERIMENTAL-UNFLASHED.bin \
            --self-test >/tmp/cfs-pwm1-registry.json
          python - <<'PY'
          import json
          with open("/tmp/cfs-pwm1-registry.json") as f:
              d = json.load(f)
          v = d["v322"]
          assert len(v["static"]["pinned_registry_thumb_instructions"]) == 29
          assert v["static"]["separate_five_object_constructor_registers_type9"]
          assert not v["static"]["five_original_device_names_resolved"]
          assert not v["static"]["concrete_pwm1_object_is_one_of_five_proven"]
          assert v["static"]["original_name"] == "pwm1"
          assert v["static"]["original_lookup_type"] == 9
          cases = v["named_registry_walk_cases"]
          assert [x["scenario"] for x in cases] == [
              "first_name_match", "second_name_match",
              "third_name_match", "no_match", "empty_registry",
              "name_prefix_not_match", "case_sensitive"
          ]
          assert [x["original_device_pointer_stored"] for x in cases] == [
              "0x20002000", "0x20002100", "0x20002200",
              "0x0", "0x0", "0x20002100", "0x20002100"
          ]
          assert [len(x["synthetic_list_comparisons"]) for x in cases] == [
              1, 2, 3, 2, 0, 2, 2
          ]
          assert all(x["original_name_type"] == 9 for x in cases)
          assert all(not x["real_runtime_object_identity_proven"] for x in cases)
          assert d["tamper_tests"]["count"] == 11
          assert d["real_device_registry_contents_not_observed"]
          assert not d["runtime_motor_object_identity_proven"]
          assert not d["independent_motor_stop_feedback_proven"]
          assert not d["firmware_release_authorized"]
          assert not d["physical_CFS_or_serial_accessed"]
          print("PASS: original pwm1 registry list walker, 7 synthetic scenarios, 9 CRC-valid mutations")
          PY
      - name: Inspect original PWM name initializer and device field provenance (OFFLINE)
        working-directory: firmware/v3.22-readonly-state-probes
        run: |
          python pwm1_name_init_static_audit.py \
            --v322 CFS-v3_22-PROBE-EXPERIMENTAL-UNFLASHED.bin \
            --json-out /tmp/cfs-name-writer-disasm.json
          python - <<'PY'
          import json
          with open("/tmp/cfs-name-writer-disasm.json") as f:
              d = json.load(f)
          x = d["verified_unrelated_GPIO_field_store"]
          assert x["instruction"] == "0x08027FA0"
          assert x["target_RAM"] == "0x2000072c"
          assert not x["is_one_of_five_PWM_names"]
          assert x["five_name_fields"] == [
              "0x200007b0", "0x20000810", "0x20000870",
              "0x200008d0", "0x20000930"
          ]
          assert not d["actual_pwm1_object_or_callback_proven"]
          assert d["halfword_decode_can_contain_data_false_positives"]
          print("PASS: exclude GPIO +0x54 store and literal-table false code")
          PY
      - name: Trace CFS pwm1 startup RAM name-field source (OFFLINE)
        working-directory: firmware/v3.22-readonly-state-probes
        run: |
          python pwm1_init_ram_origin_probe.py \
            --v322 CFS-v3_22-PROBE-EXPERIMENTAL-UNFLASHED.bin \
            --json-out /tmp/cfs-pwm-name-origin.json
          python - <<'PY'
          import json
          with open("/tmp/cfs-pwm-name-origin.json") as f:
              d = json.load(f)
          table = d["reset_scatter_table"]
          assert (table["from"], table["to"]) == ("0x803aa10", "0x803aa30")
          assert [r["four_words"] for r in table["entries"]] == [
              ["0x802db6c", "0x20000000", "0xbc4", "0x800316c"],
              ["0x802de38", "0x20000bc4", "0x6324", "0x80031c8"],
          ]
          assert d["pre_existing_device_name_ptr_RAM_fields"] == [
              "0x200007b0", "0x20000810", "0x20000870",
              "0x200008d0", "0x20000930"
          ]
          assert len(d["direct_memcpy_hypothesis_name_fields"]) == 5
          assert not d["pwm1_runtime_callback_proven"]
          assert d["static_ROM_does_not_prove_initialized_RAM_content"]
