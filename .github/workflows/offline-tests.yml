name: offline-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile tools
        run: python -m py_compile tools/*.py
      - name: Run v2 offline tests
        run: python tests/test_rfid_diag_v2.py
      - name: Run v2.1 offline tests
        run: python tests/test_rfid_diag_v2_1.py
      - name: Run Bambu key fixture tests
        run: python tests/test_bambu_keys.py
